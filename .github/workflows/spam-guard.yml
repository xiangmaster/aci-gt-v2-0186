name: Comment Spam Guard 🛡️
on:
  issue_comment:
    types:
    - created
  discussion_comment:
    types:
    - created
permissions:
  issues: write
  discussions: write
  contents: read
  models: read
jobs:
  check-spam:
    if: github.event.sender.type == 'User'
    runs-on: ubuntu-latest
    steps:
    - name: Check if first-time commenter
      id: first-time-check
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        COMMENTER: ${{ github.event.sender.login }}
      run: "# Check if user has ever contributed to this repo\nCONTRIBUTION_COUNT=$(gh
        api \\\n  \"/repos/${{ github.repository }}/commits?author=$COMMENTER&per_page=1\"\
        \ \\\n  --jq 'length' 2>/dev/null || echo \"0\")\n\nPR_COUNT=$(gh pr list
        \\\n  --repo \"${{ github.repository }}\" \\\n  --author \"$COMMENTER\" \\\
        \n  --state all \\\n  --limit 1 \\\n  --json number \\\n  --jq 'length' 2>/dev/null
        || echo \"0\")\n\nISSUE_COUNT=$(gh issue list \\\n  --repo \"${{ github.repository
        }}\" \\\n  --author \"$COMMENTER\" \\\n  --state all \\\n  --limit 1 \\\n\
        \  --json number \\\n  --jq 'length' 2>/dev/null || echo \"0\")\n\nCOMMENT_COUNT=$(gh
        api \\\n  \"/repos/${{ github.repository }}/issues/comments?per_page=100\"\
        \ \\\n  --jq \"[.[] | select(.user.login==\\\"$COMMENTER\\\")] | length\"\
        \ 2>/dev/null || echo \"0\")\n\nTOTAL=$((CONTRIBUTION_COUNT + PR_COUNT + ISSUE_COUNT
        + COMMENT_COUNT))\n\nif [ \"$TOTAL\" -eq 1 ]; then\n  echo \"is_first_time=true\"\
        \ >> \"$GITHUB_OUTPUT\"\n  echo \"🆕 First-time commenter detected: $COMMENTER\"\
        \nelse\n  echo \"is_first_time=false\" >> \"$GITHUB_OUTPUT\"\n  echo \"✅ Known
        contributor: $COMMENTER (contributions: $TOTAL)\"\nfi\n"
    - name: Skip spam check for known contributors
      if: steps.first-time-check.outputs.is_first_time != 'true'
      run: "echo \"✅ Skipping spam check for known contributor\"\nexit 0\n"
    - name: Analyze comment for spam with AI
      if: steps.first-time-check.outputs.is_first_time == 'true'
      id: ai-analyze
      uses: actions/ai-inference@v1
      with:
        model: mistral-ai/Ministral-3B
        prompt: "You are a spam and phishing detector for the OmniBlocks scratch-gui
          repository.\nYour job is to analyze comments from first-time contributors
          and determine if they are spam, phishing, or legitimate.\n\nCOMMENT AUTHOR:
          ${{ github.event.sender.login }}\nCOMMENT TEXT:\n${{ github.event.comment.body
          }}\n\nSPAM DETECTION RULES:\n\n**SPAM indicators (flag as SPAM):**\n- Cryptocurrency/NFT
          promotions or scams\n- \"I can build X for $Y\" offers soliciting paid work\n\
          - Repeated words/characters with no meaning\n- Links to unrelated products,
          services, or websites\n- Generic marketing messages\n- \"Click here to win/earn/get\"\
          \ type messages\n- Phishing attempts or credential harvesting\n- Malicious
          links or shortened URLs (bit.ly, tinyurl, etc.)\n- Requests for personal
          information\n- Adult content or inappropriate material\n\n**SUSPICIOUS indicators
          (flag as SUSPICIOUS):**\n- First comment is overly promotional but somewhat
          relevant\n- Contains external links but could be legitimate\n- Unusual formatting
          or excessive emojis\n- Generic praise without specific context\n- Off-topic
          but not clearly malicious\n\n**SAFE indicators:**\n- Genuine bug reports
          or feature requests\n- Asking legitimate questions about the project\n-
          Providing helpful feedback or suggestions\n- Thanking maintainers or contributors\n\
          - Contributing to technical discussions\n- Friendly greetings or introductions\n\
          \nOUTPUT FORMAT:\nRespond with EXACTLY ONE of these three words: SAFE, SUSPICIOUS,
          or SPAM\nDo not include any explanations, reasoning, or additional text.\n\
          Just the single word classification.\n"
    - name: Parse AI classification
      if: steps.first-time-check.outputs.is_first_time == 'true'
      id: classification
      run: "RESPONSE=\"${{ steps.ai-analyze.outputs.response }}\"\n# Clean and normalize
        the response - extract first word only\nCLEAN=$(echo \"$RESPONSE\" | tr '[:lower:]'
        '[:upper:]' | grep -o '^[A-Z]*' | head -c 20)\n\n# Default to SAFE if response
        is invalid\nif [[ \"$CLEAN\" == \"SPAM\" ]]; then\n  echo \"verdict=SPAM\"\
        \ >> \"$GITHUB_OUTPUT\"\nelif [[ \"$CLEAN\" == \"SUSPICIOUS\" ]]; then\n \
        \ echo \"verdict=SUSPICIOUS\" >> \"$GITHUB_OUTPUT\"\nelse\n  echo \"verdict=SAFE\"\
        \ >> \"$GITHUB_OUTPUT\"\nfi\n\necho \"📊 Classification: $CLEAN\"\n"
    - name: Handle SPAM comment
      if: steps.classification.outputs.verdict == 'SPAM'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        COMMENT_ID: ${{ github.event.comment.id }}
        COMMENTER: ${{ github.event.sender.login }}
        COMMENT_BODY: ${{ github.event.comment.body }}
      run: "# Delete the spam comment\ngh api \\\n  --method DELETE \\\n  -H \"Accept:
        application/vnd.github+json\" \\\n  -H \"X-GitHub-Api-Version: 2022-11-28\"\
        \ \\\n  \"/repos/${{ github.repository }}/issues/comments/$COMMENT_ID\"\n\n\
        # Post notification for maintainers\nNOTIFICATION=\"🚨 **SPAM DETECTED AND
        DELETED**\n\n**User:** @$COMMENTER (first-time commenter)\n**Comment ID:**
        $COMMENT_ID\n**Timestamp:** $(date -u +\"%Y-%m-%d %H:%M:%S UTC\")\n\n**Original
        comment:**\n\\`\\`\\`\n${COMMENT_BODY:0:500}\n\\`\\`\\`\n\n**Action taken:**
        Comment deleted automatically by spam guard.\n\ncc: @supervoidcoder - Review
        if this was a false positive.\"\n\nif [[ \"${{ github.event_name }}\" == \"\
        issue_comment\" ]]; then\n  echo \"$NOTIFICATION\" | gh issue comment ${{
        github.event.issue.number }} --body-file - || echo \"Failed to post spam notification\"\
        \nfi\n"
    - name: Handle SUSPICIOUS comment
      if: steps.classification.outputs.verdict == 'SUSPICIOUS'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        COMMENT_ID: ${{ github.event.comment.id }}
        COMMENTER: ${{ github.event.sender.login }}
      run: "# Get the comment node ID for GraphQL\nNODE_ID=$(gh api \\\n  \"/repos/${{
        github.repository }}/issues/comments/$COMMENT_ID\" \\\n  --jq '.node_id')\n\
        \n# Minimize the comment as OFF_TOPIC\ngh api graphql -f query='\n  mutation($id:
        ID!) {\n    minimizeComment(input: {subjectId: $id, classifier: OFF_TOPIC})
        {\n      clientMutationId\n    }\n  }' -f id=\"$NODE_ID\"\n\n# Post notification
        for maintainers\nNOTIFICATION=\"⚠️ **SUSPICIOUS COMMENT DETECTED**\n\n**User:**
        @$COMMENTER (first-time commenter)\n**Comment ID:** $COMMENT_ID\n**Timestamp:**
        $(date -u +\"%Y-%m-%d %H:%M:%S UTC\")\n\n**Action taken:** Comment minimized
        as off-topic. Please review.\n\ncc: @supervoidcoder - Review and take further
        action if needed.\"\n\nif [[ \"${{ github.event_name }}\" == \"issue_comment\"\
        \ ]]; then\n  echo \"$NOTIFICATION\" | gh issue comment ${{ github.event.issue.number
        }} --body-file -\nelif [[ \"${{ github.event_name }}\" == \"discussion_comment\"\
        \ ]]; then\n  echo \"$NOTIFICATION\" | gh api \\\n    --method POST \\\n \
        \   -H \"Accept: application/vnd.github+json\" \\\n    \"/repos/${{ github.repository
        }}/discussions/${{ github.event.discussion.number }}/comments\" \\\n    -f
        body=\"$NOTIFICATION\"\nfi\n"
    - name: Log safe first-time comment
      if: steps.classification.outputs.verdict == 'SAFE'
      run: "echo \"✅ SAFE comment from first-time contributor @${{ github.event.sender.login
        }}\"\necho \"No action required - legitimate comment\"\n"
    - name: Add comprehensive audit log
      if: steps.first-time-check.outputs.is_first_time == 'true'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: "# Always construct complete audit log for all verdicts\nAUDIT_LOG=\"<!--
        spam-guard-audit: user=${{ github.event.sender.login }} verdict=${{ steps.classification.outputs.verdict
        }} comment_id=${{ github.event.comment.id }} timestamp=$(date -u +\"%Y-%m-%d
        %H:%M:%S UTC\") event=${{ github.event_name }} -->\"\n\n# Branch on event
        type to post to correct target\nif [[ \"${{ github.event_name }}\" == \"issue_comment\"\
        \ ]]; then\n  # Post audit log to issue comments for issue_comment events\n\
        \  echo \"$AUDIT_LOG\" | gh issue comment ${{ github.event.issue.number }}
        --body-file -\nelif [[ \"${{ github.event_name }}\" == \"discussion_comment\"\
        \ ]]; then\n  # Post audit log to discussions API for discussion_comment events\n\
        \  echo \"$AUDIT_LOG\" | gh api \\\n    --method POST \\\n    -H \"Accept:
        application/vnd.github+json\" \\\n    \"/repos/${{ github.repository }}/discussions/${{
        github.event.discussion.number }}/comments\" \\\n    -f body=\"$AUDIT_LOG\"\
        \nelse\n  echo \"⚠️ Unknown event type: ${{ github.event_name }} - audit log
        not posted\"\nfi"
